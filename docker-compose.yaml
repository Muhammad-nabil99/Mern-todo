services:
  web:
    build:
      context: frontend
    environment:
      - REACT_APP_API_URL=/api
    ports:
      - "3000:3000"
    networks:
      - proxy-net
    restart: always

  api:
    build:
      context: backend
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DB_URL=mongodb://admin:pass123@db:27017/?authSource=admin
    restart: always
    depends_on:
      - db
    networks:
      - proxy-net

  db:
    image: mongo:4.4
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123
    volumes:
      - mongodb-sarvin:/data/db
    networks:
      - proxy-net
    restart: always

  mongoExpress:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_SITE_BASEURL=/mongo/
      - ME_CONFIG_BASICAUTH_USERNAME=sarvin
      - ME_CONFIG_BASICAUTH_PASSWORD=sarvinpass
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass123
      - ME_CONFIG_MONGODB_SERVER=db
    depends_on:
      - db
    networks:
      - proxy-net
    restart: always

volumes:
  mongodb-sarvin:

networks:
  proxy-net:
    external: true
